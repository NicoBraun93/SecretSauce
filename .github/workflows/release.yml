name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine and Set Version
        id: versioning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Get base version from package.json
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "Base version from package.json: $BASE_VERSION"

          # Fetch all tags from origin to check existence
          git fetch --tags

          # Check if tag v$BASE_VERSION exists
          if git rev-parse "refs/tags/v$BASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$BASE_VERSION already exists. Bumping version..."

            # Find latest tag matching v<major>.<minor>.*
            IFS='.' read -r major minor patch <<< "$BASE_VERSION"
            LATEST_TAG=$(git tag -l "v$major.$minor.*" | sort -V | tail -n1)

            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v$BASE_VERSION"
            fi

            echo "Latest tag found: $LATEST_TAG"
            LATEST_VERSION="${LATEST_TAG#v}"

            IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
            new_patch=$((patch + 1))
            TARGET_VERSION="$major.$minor.$new_patch"
          else
            echo "Tag v$BASE_VERSION does not exist yet. Using base version..."
            TARGET_VERSION="$BASE_VERSION"
          fi

          echo "Determined version: $TARGET_VERSION"

          # Set version locally in package.json (temporary inside runner, won't trigger CI loop).
          # package-app.sh reads this value when stamping the bundle's Info.plist.
          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version

          # Push the tag to GitHub
          git tag "v$TARGET_VERSION"
          git push origin "v$TARGET_VERSION"

          echo "version=v$TARGET_VERSION" >> $GITHUB_OUTPUT

      - name: Build and Package Native App (universal)
        run: bash native/package-app.sh

      - name: Compress App Bundle
        run: |
          mkdir -p dist-release
          # ditto preserves symlinks, code signature, and resource forks.
          echo "Compressing universal macOS build..."
          ditto -c -k --sequesterRsrc --keepParent release/SecretSauce.app dist-release/SecretSauce-mac-universal.zip

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.versioning.outputs.version }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set — cannot sign the appcast." >&2
            exit 1
          fi
          # generate_appcast ships with the Sparkle SPM artifact that package-app.sh
          # already resolved during the build step.
          GEN="$(find native/.build/artifacts -type f -name generate_appcast | head -1)"
          if [ -z "$GEN" ]; then
            echo "::error::generate_appcast not found under native/.build/artifacts" >&2
            exit 1
          fi
          KEYFILE="$(mktemp)"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          # EdDSA-sign the archive and emit a single-item appcast whose enclosure
          # points at this release's zip asset.
          "$GEN" \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/NicoBraun93/SecretSauce/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/NicoBraun93/SecretSauce" \
            -o dist-release/appcast.xml \
            dist-release
          rm -f "$KEYFILE"
          echo "----- appcast.xml -----"
          cat dist-release/appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: SecretSauce ${{ steps.versioning.outputs.version }}
          body: |
            ## Automated Release

            Native macOS build of SecretSauce — a single universal binary (Apple Silicon + Intel).

            ### Installation Instructions

            1. Download `SecretSauce-mac-universal.zip`.
            2. Extract it to get `SecretSauce.app`.
            3. Move `SecretSauce.app` to your `/Applications` directory.
            4. **Note on Gatekeeper:** Since this app is self-signed/unsigned, macOS might block its first launch. To run it:
               - Right-click `SecretSauce.app` and choose **Open**, OR
               - Run the following command in Terminal:
                 ```bash
                 xattr -cr /Applications/SecretSauce.app
                 ```
          draft: false
          prerelease: false
          files: |
            dist-release/SecretSauce-mac-universal.zip
            dist-release/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
